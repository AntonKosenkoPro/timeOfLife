name: ai-review
# Stage 1 of the two-stage review process (docs/review-process.md).
# OpenCodeReview (alibaba/open-code-review): deterministic file bundling + review agent.
# Manual trigger: comment "/review" on a PR. Advisory only — never blocks merge.
# Optional per-run params: /review [effort=low|medium|high] [budget=<n>[k|m]]
# [model=<ollama-cloud-id>] [think=max|medium|off] [full=true|false] (trusted roles only).
# Every run attaches a first-class `ai-review` entry to the PR Checks tab via
# the Checks API (issue_comment runs anchor to main HEAD, so without this bridge
# the review is invisible where reviewers look), plus a job summary (params,
# range, finding counts) on the run page.
on:
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/review') &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      # Attach the review to the PR head as a first-class Checks entry
      # (issue_comment runs otherwise anchor to main HEAD and stay invisible
      # on the PR). Least privilege: only this bridge needs it.
      checks: write
    steps:
      # issue_comment carries no PR refs — resolve head/base from the PR itself.
      - name: Resolve PR refs
        id: refs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Create AI review check run
        id: check
        # issue_comment runs anchor their automatic check runs to the
        # default-branch HEAD, so the PR Checks tab never shows this review.
        # Bridge that gap explicitly: a first-class `ai-review` entry on the
        # PR head, kept in_progress while the model works and finalized below.
        # Advisory only — it concludes success even with findings (never gates
        # merge); superseded runs (concurrency cancel) finalize as cancelled.
        # Fail-open: a create failure warns and lets the review run anyway
        # (the job summary + comments remain the fallback surface).
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            if (!/^[0-9a-f]{40}$/i.test(headSha || '')) {
              core.warning(`Not creating an ai-review check run for unexpected head_sha '${headSha}'.`);
              return;
            }
            const detailsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: run } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'ai-review',
              head_sha: headSha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: detailsUrl,
              external_id: `${context.runId}/${context.runAttempt}`
            });
            core.setOutput('check_run_id', String(run.id));
            core.info(`ai-review check run ${run.id} opened on ${headSha}`);

      - name: Parse /review params
        id: params
        uses: actions/github-script@v7
        with:
          script: |
            // Grammar: /review [effort=low|medium|high] [budget=<n>[k|m]] [model=<ollama-cloud-id>] [think=max|medium|off] [full=true|false]
            // Only the /review line carries params (first line whose first token
            // is /review); all other text is ignored (bare-/review compatible).
            // First occurrence of a key wins; duplicates never override.
            // Recognized key + invalid value fails the job with usage (fail-closed,
            // before any spend). Cost-affecting overrides are restricted to
            // trusted roles; everyone else may run bare /review (CI defaults).
            const body = context.payload.comment?.body || '';
            const reviewLine = (body.split('\n').find((l) => /^\s*\/review\b/i.test(l)) || '');
            const tail = reviewLine.replace(/^\s*\/review\b/i, '');
            const params = {};
            for (const t of tail.split(/\s+/)) {
              const m = t.match(/^(effort|budget|model|think|full)=(\S+)$/i);
              if (m && params[m[1].toLowerCase()] === undefined) params[m[1].toLowerCase()] = m[2];
            }
            const usage = 'Usage: /review [effort=low|medium|high] [budget=<n>[k|m]] [model=<ollama-cloud-id>] [think=max|medium|off] [full=true|false]';
            const fail = (msg) => { core.setFailed(`::error::${msg}\n${usage}`); };
            // Tokens that look like params but sit outside the /review line are
            // never honored — say so loudly instead of silently running defaults.
            // Same shape as the parse grammar (key + non-empty value; bare
            // `key=` can never be a param), compared case-insensitively like
            // the parser so a honored `Effort=low` isn't misreported.
            const tailTokens = tail.split(/\s+/);
            const displaced = body.split(/\s+/).filter((t) =>
              /^(effort|budget|model|think|full)=\S+$/i.test(t) &&
              !tailTokens.some((u) => u.toLowerCase() === t.toLowerCase()));
            if (displaced.length > 0) {
              core.notice(`key=value params are only honored on the /review line; ignoring: ${displaced.join(' ')}`);
            }
            // Loudness parity: later duplicates of a captured key are also
            // dropped (first occurrence wins) — surface those too.
            const seenKeys = new Set();
            const overridden = tailTokens.filter((t) => {
              const m = t.match(/^(effort|budget|model|think|full)=(\S+)$/i);
              if (!m) return false;
              const k = m[1].toLowerCase();
              if (seenKeys.has(k)) return true;
              seenKeys.add(k);
              return false;
            });
            if (overridden.length > 0) {
              core.notice(`duplicate /review params are ignored (first occurrence wins): ${overridden.join(' ')}`);
            }
            let effort = (params.effort || 'medium').toLowerCase();
            if (!['low', 'medium', 'high'].includes(effort)) return fail(`Invalid effort '${params.effort}'.`);
            let budget;
            {
              const raw = params.budget || '20000000';
              const m = raw.match(/^(\d+)([kKmM])?$/);
              if (!m) return fail(`Invalid budget '${params.budget}'.`);
              budget = parseInt(m[1], 10) * (m[2] ? (m[2].toLowerCase() === 'k' ? 1e3 : 1e6) : 1);
              if (budget < 1e6 || budget > 1e8) return fail(`Budget ${budget} out of range [1000000, 100000000].`);
            }
            let model = (params.model || 'deepseek-v4.1-flash:1017').toLowerCase();
            if (!/^[a-z0-9._:/-]+$/.test(model)) return fail(`Invalid model '${params.model}'. Use an Ollama Cloud model ID (e.g. deepseek-v4.1-flash:1017, glm-5.3-flash).`);
            let think = (params.think || 'max').toLowerCase();
            if (!['max', 'medium', 'off'].includes(think)) return fail(`Invalid think '${params.think}'.`);
            let full = (params.full || 'false').toLowerCase();
            if (!['true', 'false'].includes(full)) return fail(`Invalid full '${params.full}'.`);
            // Cost-affecting overrides are restricted to trusted roles (checked
            // after value validation so a bad value still reports its usage
            // error); everyone else may run bare /review (CI defaults).
            if (Object.keys(params).length > 0) {
              const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR']
                .includes(context.payload.comment?.author_association);
              if (!trusted) return fail('/review params are limited to owners/members/collaborators.');
            }
            core.exportVariable('EFFORT', effort);
            core.exportVariable('MAX_TOKENS_BUDGET', String(budget));
            core.exportVariable('REVIEW_MODEL', model);
            core.exportVariable('THINK', think);
            // Byte-identical to the pre-params literal '{"think": "max"}' when
            // think=max (allowlisted tokens need no JSON escaping), so bare
            // /review keeps the checkpoint fingerprint unchanged.
            core.exportVariable('EXTRA_BODY', '{"think": "' + think + '"}');
            core.exportVariable('FULL_REVIEW', full);
            core.info(`review params: effort=${effort} budget=${budget} model=${model} think=${think} full=${full}`);

      - name: Run OpenCodeReview
        id: review
        # The action performs its own full checkout (fetch-depth: 0).
        uses: alibaba/open-code-review@v1.12.9
        with:
          # Ollama Cloud — OpenAI-compatible endpoint (models.dev: ollama-cloud base URL).
          llm_url: https://ollama.com/v1
          llm_auth_token: ${{ secrets.OLLAMA_API_KEY }}
          # Any Ollama Cloud model ID (endpoint fixed; parse step validates
          # charset, trusted roles only). CI default is deepseek-v4.1-flash:1017;
          # e.g. `/review model=glm-5.3-flash` for the previous default.
          llm_model: ${{ env.REVIEW_MODEL }}
          # openai protocol (explicit; supersedes the required llm_use_anthropic boolean)
          llm_protocol: openai
          llm_use_anthropic: 'false'
          # Built by the parse step as {"think": <max|medium|off>}; default
          # reproduces today's exact value so bare-/review checkpoints survive.
          # (think is the only thinking knob Ollama Cloud honors;
          # reasoning_effort is ignored there.)
          llm_extra_body: ${{ env.EXTRA_BODY }}
          llm_timeout: '600'
          review_task_timeout: '15'
          # Don't hammer Ollama Cloud rate limits.
          review_concurrency: '4'
          # Review effort medium (deeper per-file rounds; low was benchmarked
          # fastest without recall loss on small diffs — tune back if medium
          # proves wasteful there). Overridable per-run via `/review effort=low`.
          effort: ${{ env.EFFORT }}
          # Bound paid-provider spend: generous runaway guard (fail-open —
          # over-budget files report failed(budget) but partial results still
          # publish). 10x headroom so large diffs review in one run.
          # Overridable per-run via `/review budget=5m` (clamped to 1M–100M).
          max_tokens_budget: ${{ env.MAX_TOKENS_BUDGET }}
          # Stream live [ocr] progress into the log (visible in Checks).
          stream_progress: 'true'
          language: English
          # Update one summary comment in place instead of posting a new one per run.
          sticky_summary: 'true'
          # Cross-push checkpoints: the first /review covers merge-base..head; a later
          # /review covers only <checkpoint>..<head> (fail-closed: falls back to full).
          checkpoint_range: 'true'
          # Force one merge-base..head review for this run (`/review full=true`);
          # still records a new checkpoint. Default false = incremental behavior.
          full_review: ${{ env.FULL_REVIEW }}
          # All findings post inline (no severity routing to the summary).
          route_severity_below: ''
          upload_artifacts: 'true'
          # issue_comment carries no pull_request payload — pass the PR explicitly.
          pr_number: ${{ github.event.issue.number }}
          base_ref: ${{ steps.refs.outputs.base_ref }}
          head_sha: ${{ steps.refs.outputs.head_sha }}

      - name: Publish review summary
        # Always report, even when the review failed: the run page shows
        # params + outcome without opening comments or logs. Never changes
        # the job conclusion (advisory stays advisory). The next step mirrors
        # this markdown onto the PR Checks tab entry created above.
        # Third-party action outputs reach the shell only via env: (script-
        # injection policy — GH expressions expand before the shell parses).
        # The PARAMS_* values are allowlist-validated by the parse step.
        if: always()
        env:
          PARAMS_OUTCOME: ${{ steps.params.outcome }}
          SUMMARY_RANGE: ${{ steps.review.outputs.range_summary || 'n/a' }}
          SUMMARY_TOTAL: ${{ steps.review.outputs.comments_total || '0' }}
          SUMMARY_INLINE: ${{ steps.review.outputs.comments_inline || '0' }}
          SUMMARY_FAILED: ${{ steps.review.outputs.comments_failed || '0' }}
          SUMMARY_ROUTED: ${{ steps.review.outputs.comments_routed || '0' }}
          SUMMARY_URL: ${{ steps.review.outputs.summary_comment_url || 'n/a' }}
          SUMMARY_CHECKPOINT: ${{ steps.review.outputs.checkpoint_after || 'n/a' }}
        run: |
          {
            echo "## AI review"
            echo ""
            if [ "$PARAMS_OUTCOME" != "success" ]; then
              echo "- Params: not captured (parse step outcome: $PARAMS_OUTCOME; see job log for the failing value)"
            else
              echo "- Params: effort=\`$EFFORT\` budget=\`$MAX_TOKENS_BUDGET\` model=\`$REVIEW_MODEL\` think=\`$THINK\` full=\`$FULL_REVIEW\`"
            fi
            echo "- Range: \`$SUMMARY_RANGE\`"
            echo "- Findings: \`$SUMMARY_TOTAL\` total, \`$SUMMARY_INLINE\` inline, \`$SUMMARY_FAILED\` failed, \`$SUMMARY_ROUTED\` routed"
            echo "- Summary: $SUMMARY_URL"
            echo "- Checkpoint: \`$SUMMARY_CHECKPOINT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize AI review check run
        # Always finalize our own check run (created above), even when the
        # review failed or this run was superseded: the PR Checks tab shows
        # params + outcome without opening comments or logs. Never changes
        # the job conclusion (advisory stays advisory).
        # Third-party action outputs reach the script only via env: (script-
        # injection policy — GH expressions expand before the JS parses).
        # The PARAMS_*/EFFORT values are allowlist-validated by the parse step.
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_RUN_ID: ${{ steps.check.outputs.check_run_id }}
          JOB_CANCELLED: ${{ cancelled() }}
          PARAMS_OUTCOME: ${{ steps.params.outcome }}
          SUMMARY_RANGE: ${{ steps.review.outputs.range_summary || 'n/a' }}
          SUMMARY_TOTAL: ${{ steps.review.outputs.comments_total || '0' }}
          SUMMARY_INLINE: ${{ steps.review.outputs.comments_inline || '0' }}
          SUMMARY_FAILED: ${{ steps.review.outputs.comments_failed || '0' }}
          SUMMARY_ROUTED: ${{ steps.review.outputs.comments_routed || '0' }}
          SUMMARY_URL: ${{ steps.review.outputs.summary_comment_url || 'n/a' }}
          SUMMARY_CHECKPOINT: ${{ steps.review.outputs.checkpoint_after || 'n/a' }}
        with:
          script: |
            // Each job only ever finalizes the check run its own create step
            // returned (passed via step output, never re-queried by name), so
            // a superseding run can never clobber its predecessor's entry.
            const id = Number(process.env.CHECK_RUN_ID);
            if (!id) {
              core.warning('No ai-review check run to finalize (create step was skipped or failed).');
              return;
            }
            const lines = ['## AI review', ''];
            if (process.env.PARAMS_OUTCOME !== 'success') {
              lines.push(`- Params: not captured (parse step outcome: ${process.env.PARAMS_OUTCOME}; see job log for the failing value)`);
            } else {
              lines.push(`- Params: effort=\`${process.env.EFFORT}\` budget=\`${process.env.MAX_TOKENS_BUDGET}\` model=\`${process.env.REVIEW_MODEL}\` think=\`${process.env.THINK}\` full=\`${process.env.FULL_REVIEW}\``);
            }
            lines.push(`- Range: \`${process.env.SUMMARY_RANGE}\``);
            lines.push(`- Findings: \`${process.env.SUMMARY_TOTAL}\` total, \`${process.env.SUMMARY_INLINE}\` inline, \`${process.env.SUMMARY_FAILED}\` failed, \`${process.env.SUMMARY_ROUTED}\` routed`);
            lines.push(`- Summary: ${process.env.SUMMARY_URL}`);
            lines.push(`- Checkpoint: \`${process.env.SUMMARY_CHECKPOINT}\``);
            const cancelled = process.env.JOB_CANCELLED === 'true';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: id,
              status: 'completed',
              // Advisory stays advisory: success whenever the bridge ran,
              // cancelled when superseded. Findings, parse failures, and
              // action errors are reported in the output text, never mapped
              // to the conclusion. No annotations: inline findings remain
              // the only per-file surface.
              conclusion: cancelled ? 'cancelled' : 'success',
              completed_at: new Date().toISOString(),
              output: {
                title: 'AI review (advisory)',
                summary: lines.join('\n')
              }
            });
            core.info(`ai-review check run ${id} finalized (${cancelled ? 'cancelled' : 'success'}).`);