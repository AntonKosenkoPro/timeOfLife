name: ai-review
# Stage 1 of the two-stage review process (docs/review-process.md).
# OpenCodeReview (alibaba/open-code-review): deterministic file bundling + review agent.
# Advisory only: findings are posted as PR review comments, the job never blocks merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Run OpenCodeReview
        # The action performs its own full checkout (fetch-depth: 0).
        uses: alibaba/open-code-review@v1.12.9
        with:
          # Ollama Cloud — OpenAI-compatible endpoint (models.dev: ollama-cloud base URL).
          llm_url: https://ollama.com/v1
          llm_auth_token: ${{ secrets.OLLAMA_API_KEY }}
          llm_model: deepseek-v4.1-flash
          # openai protocol (explicit; supersedes the required llm_use_anthropic boolean)
          llm_protocol: openai
          llm_use_anthropic: 'false'
          # Disable reasoning for latency/cost; DeepSeek uses the Anthropic-style toggle.
          llm_extra_body: '{"thinking": {"type": "disabled"}}'
          llm_timeout: '600'
          review_task_timeout: '15'
          # Don't hammer Ollama Cloud rate limits.
          review_concurrency: '4'
          language: English
          # Update one summary comment in place instead of posting a new one per run.
          sticky_summary: 'true'
          # Cross-push checkpoints: after the first run, later pushes review only
          # <checkpoint>..<head>, not the whole PR (fail-closed: falls back to full).
          checkpoint_range: 'true'
          # Low-severity findings go to the sticky summary, not inline — less PR noise.
          route_severity_below: 'low'
          upload_artifacts: 'true'