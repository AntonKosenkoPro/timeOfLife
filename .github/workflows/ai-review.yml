name: ai-review
# Stage 1 of the two-stage review process (docs/review-process.md).
# OpenCodeReview (alibaba/open-code-review): deterministic file bundling + review agent.
# Manual trigger: comment "/review" on a PR. Advisory only — never blocks merge.
on:
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/review') &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      # issue_comment carries no PR refs — resolve head/base from the PR itself.
      - name: Resolve PR refs
        id: refs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Run OpenCodeReview
        # The action performs its own full checkout (fetch-depth: 0).
        uses: alibaba/open-code-review@v1.12.9
        with:
          # OpenCode Zen — OpenAI Responses endpoint (models list: https://opencode.ai/docs/zen).
          llm_url: https://opencode.ai/zen/v1/responses
          llm_auth_token: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          llm_model: muse-spark-1.3-contributor-free
          # openai-responses protocol for the /responses endpoint (explicit;
          # supersedes the required llm_use_anthropic boolean)
          llm_protocol: openai-responses
          llm_use_anthropic: 'false'
          # No provider-specific extra body for Zen; omit the DeepSeek thinking toggle.
          llm_timeout: '600'
          review_task_timeout: '15'
          # Don't hammer Zen rate limits (free contributor tier).
          review_concurrency: '4'
          language: English
          # Update one summary comment in place instead of posting a new one per run.
          sticky_summary: 'true'
          # Cross-push checkpoints: the first /review covers merge-base..head; a later
          # /review covers only <checkpoint>..<head> (fail-closed: falls back to full).
          checkpoint_range: 'true'
          # Low-severity findings go to the sticky summary, not inline — less PR noise.
          route_severity_below: 'medium'
          upload_artifacts: 'true'
          # issue_comment carries no pull_request payload — pass the PR explicitly.
          pr_number: ${{ github.event.issue.number }}
          base_ref: ${{ steps.refs.outputs.base_ref }}
          head_sha: ${{ steps.refs.outputs.head_sha }}