# App Store screenshots pipeline (OpenSpec change optimize-app-screenshot-workflow).
#
# Device-affine session capture on macOS: one validated Ubuntu selection
# job, one explicit arm64 Screenshot build with a verified artifact, one
# capture worker per selected device (sequential locales, single pass,
# pinned + realtime sessions via run_device_worker.py), then fast panels + zip on a
# separate job. Binaries never enter git — the only downloadables are the
# `screenshot-build` and `shots-<device>-<locale>` artifacts attached to
# the run, plus the final `lifio-screenshots` bundle.
#
# Honest constraints (see specs/screenshot-capture-workflow/spec.md):
# - The device matrix varies by device ONLY (max five overlapping
#   workers); locales run sequentially inside each worker. Queueing for a
#   slot is reported, never subtracted from an end-to-end claim.
# - CI sets run under LIFIO_CAPTURE_CI=1 (logged in every manifest as
#   ci_approval_bypass:true): technically gated, NOT owner eyeball-approved.
# - The shared build is verified (hashes, slices, provenance) BEFORE any
#   worker installs it; a cache miss rebuilds, never substitutes.
# - Panel rendering needs macOS system fonts (Helvetica/Hiragino with
#   loud failure if unreadable), so the panels job runs on the same
#   xcode-27 macOS pool as build/capture (fast: checkout + Pillow only,
#   shared five-mac ceiling). Headline pixel-identity across pools is
#   NOT claimed until a CI render on this pool proves it.
# - Apple bezel PNGs are NOT in git (no-binaries rule): the panels job
#   downloads them from the PRIVATE lifio-design-assets release
#   `apple-bezels-v2` with APPLE_BEZELS_TOKEN (repo secret, step-scoped
#   GH_TOKEN only; live design-service fetch retired). Without the secret the
#   panels job fails closed; the release manifest SHA is verified
#   before any PNG is used, and raw bezels never enter the public ZIP.
# - iOS runtime + Xcode on the runner are assumed; fail-fast checks stop
#   the run with a clear message otherwise (the iOS 27 download fallback
#   is retained).
# - Live Activity lock-screen/island frames have no simctl equivalent for
#   the power-button/lock path: the realtime session records hash-bound
#   pending handoffs and the run manifest records needs-inspection until
#   a human registers genuine pixels via record-external-frame.

name: app-screenshots

on:
  workflow_dispatch:
    inputs:
      ios_runtime:
        description: "iOS simulator runtime (e.g. iOS 27.0)"
        required: false
        default: "iOS 27.0"
      devices:
        description: 'JSON device keys (catalog in scripts/screenshots/workflow_inputs.py).'
        required: false
        default: '["iphone69","iphone63","ipad13"]'
      languages:
        description: 'JSON locale list.'
        required: false
        default: '["en","ru","zh-Hans","es-419","pt-BR"]'

permissions:
  contents: read

concurrency:
  group: app-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate selection
    # 6.1: non-empty, unique, catalog-known device/locale/runtime
    # selection, checked on cheap Ubuntu BEFORE any macOS work. Values
    # are compared against fixed catalogs, never evaluated as source.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      devices: ${{ steps.selection.outputs.devices }}
      languages: ${{ steps.selection.outputs.languages }}
      runtime: ${{ steps.selection.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate device/locale/runtime selection
        id: selection
        env:
          DEVICES: ${{ inputs.devices }}
          LANGUAGES: ${{ inputs.languages }}
          IOS_RUNTIME: ${{ inputs.ios_runtime }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, "scripts/screenshots")
          import workflow_inputs as wi
          try:
              summary = wi.validate_selection(
                  os.environ["DEVICES"],
                  os.environ["LANGUAGES"],
                  os.environ["IOS_RUNTIME"],
              )
          except wi.InputError as exc:
              print(f"::error::invalid selection: {exc}")
              raise SystemExit(2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"devices={json.dumps(summary['devices'])}\n")
              fh.write(f"languages={json.dumps(summary['locales'])}\n")
              fh.write(f"runtime={summary['runtime']}\n")
          print(f"validated: {summary['worker_count']} device worker(s), "
                f"{summary['pair_count']} pairs, "
                f"{summary['pass_count']} passes on {summary['runtime']}")
          PY

      - name: Preflight private bezel manifest
        # Cheap credential/digest gate on Ubuntu BEFORE any macOS work:
        # downloads ONLY the release manifest (no PNGs, no uploads) and
        # verifies its pinned SHA. A missing/invalid token or a drifted
        # manifest fails the run here with a clear config error instead
        # of burning build/capture minutes before the panels fetch
        # fails. This is NOT a trust substitute: the panels job still
        # downloads all assets and hash-verifies everything before
        # staging. Stdlib lane: shell + sha256sum only, no Pillow.
        env:
          # Step-scoped read-only token for the PRIVATE asset repo only;
          # never echoed, never passed on a command line.
          GH_TOKEN: ${{ secrets.APPLE_BEZELS_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/bezels-preflight"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::APPLE_BEZELS_TOKEN secret missing — cannot authenticate the private bezel release"
            exit 2
          fi
          gh release download apple-bezels-v2 \
            --repo AntonKosenkoPro/lifio-design-assets \
            --pattern "apple-bezels-manifest.json" \
            --dir "$RUNNER_TEMP/bezels-preflight" \
            --clobber || { echo "::error::private-release manifest download failed"; exit 2; }
          echo "c8d0ce9f2213872794a51960600755e668d9666f078cf7eb7b0ba6e5c28ae817  $RUNNER_TEMP/bezels-preflight/apple-bezels-manifest.json" | sha256sum -c - \
            || { echo "::error::bezel manifest digest mismatch — refusing a drifted source"; exit 2; }
          echo "bezel manifest preflight ok (auth + digest, manifest only)"

  build:
    name: build Screenshot (arm64)
    # 6.2: exactly one build for the whole run — explicitly arm64-only,
    # Release-optimized Screenshot configuration, pinned toolchain. App
    # AND extension slices are inspected (ONLY_ACTIVE_ARCH on a generic
    # destination proves nothing alone). 6.4: the complete app is packed
    # into a permission-preserving tar with a build/digest manifest.
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      IOS_RUNTIME: ${{ needs.validate.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode 27.1
        # Explicit toolchain selection (not just a check of whatever is
        # active): only an installed Xcode 27.1 may build. No silent
        # fallback to a wrong toolchain — absence fails closed here.
        run: |
          SELECTED=""
          for app in /Applications/Xcode_27.1.app /Applications/Xcode.app; do
            BIN="$app/Contents/Developer/usr/bin/xcodebuild"
            [ -x "$BIN" ] || continue
            VER="$("$BIN" -version | grep -m1 -o '[0-9][0-9.]*' | head -n1)"
            if [ "$VER" = "27.1" ]; then
              SELECTED="$app/Contents/Developer"
              break
            fi
          done
          [ -n "$SELECTED" ] || { echo "::error::no installed Xcode 27.1 found under /Applications"; exit 2; }
          echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          echo "selected Xcode 27.1 at $SELECTED"

      - name: Fail fast on toolchain
        run: |
          # scripts/screenshots/ is stdlib-only (no PIL import anywhere
          # there), so Pillow is installed only in the panels job that
          # renders. Installing it here added a failure mode to every
          # macOS job for nothing.
          # NOTE: no simulator-runtime check/download here — the generic
          # Screenshot build needs only the SDK, never a booted runtime;
          # downloading a platform would stall the critical path. The
          # requested runtime fallback lives in the capture workers.
          XV_OUT="$(xcodebuild -version)" || { echo "::error::Xcode missing"; exit 2; }
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts/screenshots")
          import build_artifact as ba
          out = subprocess.check_output(["xcodebuild", "-version"], text=True)
          for err in ba.validate_xcode_pin(ba.parse_xcode_version(out), "27.1"):
              print(f"::error::{err}")
              raise SystemExit(2)
          print("xcode_build=" + ba.parse_xcode_build(out))
          PY

      - name: Install pinned xcodegen
        # Same pins + digest checks as ios.yml: a clean runner has no
        # xcodegen, and an unpinned install would let the generated
        # project drift from the release gate.
        run: |
          XCODEGEN_PIN="$(grep -m1 '^XCODEGEN_PIN="' ios/TimeOfLife/ci_scripts/ci_post_clone.sh | cut -d'"' -f2 || true)"
          [ -n "$XCODEGEN_PIN" ] || { echo "::error::cannot read XCODEGEN_PIN from ci_post_clone.sh — refusing to install an unpinned xcodegen"; exit 1; }
          XCODEGEN_ZIP_SHA256="4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_PIN}/xcodegen.zip" -o "${RUNNER_TEMP}/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  ${RUNNER_TEMP}/xcodegen.zip" | shasum -a 256 -c - || \
            { echo "::error::xcodegen.zip digest mismatch for pin ${XCODEGEN_PIN} — if the pin was bumped, update XCODEGEN_ZIP_SHA256 here and in ios.yml (see docs/ci.md pin table)"; exit 1; }
          rm -rf "${RUNNER_TEMP}/xcodegen" && mkdir -p "${RUNNER_TEMP}/xcodegen"
          unzip -o -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}/xcodegen"
          BIN="$(find "${RUNNER_TEMP}/xcodegen" -path '*/bin/xcodegen' -type f -print -quit)"
          [ -n "$BIN" ] || { echo "::error::xcodegen binary not found in release archive"; exit 1; }
          XG_ROOT="$(dirname "$(dirname "$BIN")")"
          [ -d "$XG_ROOT/share/xcodegen" ] || { echo "::error::xcodegen share/xcodegen presets missing"; exit 1; }
          sudo install -m 755 "$BIN" /usr/local/bin/xcodegen
          sudo rm -rf /usr/local/share/xcodegen
          sudo mkdir -p /usr/local/share && sudo cp -R "$XG_ROOT/share/xcodegen" /usr/local/share/
          test "$(/usr/local/bin/xcodegen --version | grep -m1 -o '[0-9][0-9.]*' | head -n1)" = "$XCODEGEN_PIN" || \
            { echo "::error::xcodegen drift: got $(/usr/local/bin/xcodegen --version), want $XCODEGEN_PIN"; exit 1; }
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Compute dependency cache key
        id: cache-key
        env:
          IOS_RUNTIME: ${{ needs.validate.outputs.runtime }}
        run: |
          # 6.3: dependency cache key covers the SPM lockfile plus the
          # EXACT Xcode/SDK build IDs (never marketing versions alone) +
          # arch/configuration. A compatible hit only restores checkouts;
          # the normal build below ALWAYS runs (cold miss resolves from
          # the network and rebuilds correctly).
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts/screenshots")
          import build_artifact as ba
          lock = ("ios/TimeOfLife/TimeOfLife.xcodeproj/project.xcworkspace"
                  "/xcshareddata/swiftpm/Package.resolved")
          digest = hashlib.sha256(
              open(lock, "rb").read()).hexdigest()
          out = subprocess.check_output(["xcodebuild", "-version"], text=True)
          sdk_version = subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator",
               "--show-sdk-version"], text=True).strip()
          sdk_build = subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator",
               "--show-sdk-build-version"], text=True).strip()
          if not sdk_version or not sdk_build:
              print("::error::cannot read iphonesimulator SDK "
                    "version/build via xcrun --sdk")
              raise SystemExit(2)
          key = ba.dependency_cache_key(
              {"Package.resolved": digest},
              ba.parse_xcode_version(out), ba.parse_xcode_build(out),
              sdk_version, sdk_build, "arm64", "Screenshot")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"cache_key={key}\n")
          print(f"dependency cache key: {key}")
          PY

      - name: Restore dependency checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm-checkouts
          key: screenshot-deps-${{ steps.cache-key.outputs.cache_key }}
          # No restore-keys fallback: a partial hit could substitute
          # incompatible checkouts, so only an exact hit restores.

      - name: Build Screenshot configuration
        run: |
          cd ios/TimeOfLife
          /usr/local/bin/xcodegen generate
          xcodebuild build -scheme TimeOfLife -configuration Screenshot \
            -destination "generic/platform=iOS Simulator" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-checkouts" \
            -derivedDataPath "$RUNNER_TEMP/dd"
          APP="$RUNNER_TEMP/dd/Build/Products/Screenshot-iphonesimulator/TimeOfLife.app"
          [ -d "$APP" ] || { echo "::error::built app not found at $APP"; exit 2; }

      - name: Inspect slices and package build artifact
        id: package
        env:
          IOS_RUNTIME: ${{ needs.validate.outputs.runtime }}
        run: |
          # App AND extension Mach-O slices must be exactly arm64-only;
          # then the complete .app is packed permission-preserving with a
          # build/digest manifest carrying the EXACT Xcode marketing
          # version + build ID, the SDK version + build ID from
          # `xcrun --sdk` (never the simulator runtime build), and the
          # REQUESTED runtime version + build ID recorded separately
          # (workers reject any artifact that cannot prove its toolchain).
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/screenshots")
          import build_artifact as ba

          app = Path(os.environ["RUNNER_TEMP"]) / "dd" / "Build" / \
              "Products" / "Screenshot-iphonesimulator" / "TimeOfLife.app"

          def exe_of(bundle: Path) -> Path:
              with open(bundle / "Info.plist", "rb") as fh:
                  info = plistlib.load(fh)
              exe = info.get("CFBundleExecutable")
              if not exe or not isinstance(exe, str):
                  print(f"::error::no CFBundleExecutable in {bundle}");
                  raise SystemExit(2)
              return bundle / exe if (bundle / exe).is_file() \
                  else bundle / "Contents" / "MacOS" / exe

          app_bin = exe_of(app)
          # Bind the attested hash to the EXACT expected capture
          # extension: a sorted first-glob would attest whatever extra
          # .appex sorts first while verify_app_structure (exact name,
          # ignores other PlugIns members) still passes.
          expected_appex = app / "PlugIns" / ba.SCREENSHOT_APPEX_NAME
          if not expected_appex.is_dir():
              print(f"::error::expected appex "
                    f"{ba.SCREENSHOT_APPEX_NAME} missing in the built app")
              raise SystemExit(2)
          ext_bin = exe_of(expected_appex)
          app_archs = ba.parse_lipo_archs(subprocess.check_output(
              ["lipo", "-archs", str(app_bin)], text=True))
          ext_archs = ba.parse_lipo_archs(subprocess.check_output(
              ["lipo", "-archs", str(ext_bin)], text=True))
          errs = ba.validate_slices(app_archs, ext_archs)
          if errs:
              for e in errs:
                  print(f"::error::{e}")
              raise SystemExit(2)
          print(f"slices arm64-only: app + {ba.SCREENSHOT_APPEX_NAME}")

          xcode_out = subprocess.check_output(["xcodebuild", "-version"],
                                              text=True)
          xcode_version = ba.parse_xcode_version(xcode_out)
          xcode_build = ba.parse_xcode_build(xcode_out)
          for err in ba.validate_xcode_pin(xcode_version, "27.1"):
              print(f"::error::{err}")
              raise SystemExit(2)
          sdk_runtime = os.environ["IOS_RUNTIME"]
          sdk_version = subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator",
               "--show-sdk-version"], text=True).strip()
          sdk_build = subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator",
               "--show-sdk-build-version"], text=True).strip()
          if not sdk_version or not sdk_build:
              print("::error::cannot read iphonesimulator SDK "
                    "version/build via xcrun --sdk")
              raise SystemExit(2)
          runtime_build = None
          runtimes = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "-j", "runtimes"], text=True))
          for rt in runtimes.get("runtimes", []):
              if rt.get("name") == sdk_runtime and rt.get("buildversion"):
                  runtime_build = rt["buildversion"]
                  break
          if not runtime_build:
              # No download here (generic build needs no simulator
              # runtime): without an installed runtime its build ID is
              # unknowable, and a manifest that cannot name it is
              # incomplete — fail closed instead of guessing.
              print(f"::error::runtime {sdk_runtime!r} not installed on "
                    "the build runner, so its build ID is unknowable; "
                    "install it or request an installed runtime")
              raise SystemExit(2)
          print(f"toolchain: Xcode {xcode_version} ({xcode_build}), "
                f"SDK {sdk_version} ({sdk_build}), "
                f"{sdk_runtime} ({runtime_build})")

          struct_errs = ba.verify_app_structure(app)
          if struct_errs:
              for e in struct_errs:
                  print(f"::error::{e}")
              raise SystemExit(2)
          meta = ba.pack_app(app, Path(os.environ["RUNNER_TEMP"])
                             / "screenshot-app.tar.gz")
          hashes = ba.resource_hashes(app)
          dirty = bool(subprocess.check_output(
              ["git", "status", "--porcelain", "--", ".",
               ":(exclude)ios/TimeOfLife/TimeOfLife.xcodeproj"],
              text=True).strip())
          manifest = ba.build_manifest(
              commit=subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True).strip(),
              dirty=dirty,
              configuration="Screenshot",
              xcode_version=xcode_version, xcode_build=xcode_build,
              sdk_version=sdk_version, sdk_build=sdk_build,
              runtime_version=sdk_runtime, runtime_build=runtime_build,
              arch="arm64",
              app_sha256=ba.hash_file(app_bin),
              extension_sha256=ba.hash_file(ext_bin),
              archive_sha256=meta["archive_sha256"],
              bundle_id=ba.SCREENSHOT_BUNDLE_ID,
              extension_id=ba.SCREENSHOT_EXTENSION_ID,
              resources={"files": hashes["files"],
                         "symlinks": hashes["symlinks"]})
          ba.write_manifest(Path(os.environ["RUNNER_TEMP"])
                            / "build-manifest.json", manifest)
          print(f"packed {len(meta['members'])} members, "
                f"archive {meta['archive_sha256'][:12]}")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # Named to avoid the shots-* capture pattern below.
          name: screenshot-build
          path: |
            ${{ runner.temp }}/screenshot-app.tar.gz
            ${{ runner.temp }}/build-manifest.json
          retention-days: 14

  screenshots:
    name: capture (${{ matrix.device }})
    # 6.5: one worker per selected device (dynamic matrix from the
    # validated selection), at most five overlapping; each worker owns
    # ONE simulator/install and runs its locales sequentially with a
    # SINGLE automated pass per locale (manual reruns re-invoke this
    # same flow with a fresh run identity) and both session domains
    # inside run_device_worker.py.
    needs: [validate, build]
    runs-on: xcode-27
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        device: ${{ fromJSON(needs.validate.outputs.devices) }}
    env:
      LIFIO_CAPTURE_LEASE: "1"
      # CI automation bypass (auditable, existing semantics): expansion
      # gates open without a human approval file and every manifest logs
      # ci_approval_bypass:true — never mistaken for owner approval.
      LIFIO_CAPTURE_CI: "1"
      IOS_RUNTIME: ${{ needs.validate.outputs.runtime }}
      LANGUAGES: ${{ needs.validate.outputs.languages }}
      DEVICE_KEY: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode 27.1
        # Same explicit selection as the build job: the worker must run
        # the identical toolchain it verifies against — never whatever
        # happens to be active.
        run: |
          SELECTED=""
          for app in /Applications/Xcode_27.1.app /Applications/Xcode.app; do
            BIN="$app/Contents/Developer/usr/bin/xcodebuild"
            [ -x "$BIN" ] || continue
            VER="$("$BIN" -version | grep -m1 -o '[0-9][0-9.]*' | head -n1)"
            if [ "$VER" = "27.1" ]; then
              SELECTED="$app/Contents/Developer"
              break
            fi
          done
          [ -n "$SELECTED" ] || { echo "::error::no installed Xcode 27.1 found under /Applications"; exit 2; }
          echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          echo "selected Xcode 27.1 at $SELECTED"

      - name: Fail fast on toolchain
        run: |
          xcodebuild -version || { echo "::error::Xcode missing"; exit 2; }
          if ! xcrun simctl list runtimes | grep -F "$IOS_RUNTIME"; then
            echo "::warning::runtime '$IOS_RUNTIME' not installed — downloading iOS platform"
            sudo xcodebuild -downloadPlatform iOS
            xcrun simctl list runtimes | grep -F "$IOS_RUNTIME" \
              || { echo "::error::runtime '$IOS_RUNTIME' still missing after 'xcodebuild -downloadPlatform iOS'"; exit 2; }
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: screenshot-build
          path: ${{ runner.temp }}/build

      - name: Verify build artifact
        id: verify
        # 6.4: the worker rejects incompatible/mismatched provenance
        # BEFORE touching any simulator: same commit/config/arch/bundle
        # identities, exact Xcode + SDK build IDs against this runner's
        # toolchain, permission-preserving extraction, full
        # binary/resource hashes. A cache miss upstream rebuilt; a stale
        # artifact can never be substituted or silently skipped here.
        env:
          DEVICE_KEY: ${{ matrix.device }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/screenshots")
          import build_artifact as ba
          import workflow_inputs as wi

          tmp = Path(os.environ["RUNNER_TEMP"])
          manifest = ba.load_manifest(tmp / "build" / "build-manifest.json")
          xcode_out = subprocess.check_output(["xcodebuild", "-version"],
                                              text=True)
          ours_xcode = ba.parse_xcode_version(xcode_out)
          ours_build = ba.parse_xcode_build(xcode_out)
          ours_sdk_version = subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator",
               "--show-sdk-version"], text=True).strip()
          ours_sdk_build = subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator",
               "--show-sdk-build-version"], text=True).strip()
          if not ours_sdk_version or not ours_sdk_build:
              print("::error::cannot read iphonesimulator SDK "
                    "version/build via xcrun --sdk")
              raise SystemExit(2)
          want_runtime = os.environ["IOS_RUNTIME"]
          want_rt_build = None
          runtimes = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "-j", "runtimes"], text=True))
          for rt in runtimes.get("runtimes", []):
              if rt.get("name") == want_runtime and rt.get("buildversion"):
                  want_rt_build = rt["buildversion"]
                  break
          if not want_rt_build:
              print(f"::error::no build ID for runtime {want_runtime!r}")
              raise SystemExit(2)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"],
                                         text=True).strip()
          errs = ba.verify_manifest(
              manifest, expected_commit=head,
              expected_xcode=ours_xcode,
              expected_xcode_build=ours_build,
              expected_sdk_version=ours_sdk_version,
              expected_sdk_build=ours_sdk_build,
              expected_runtime_version=want_runtime,
              expected_runtime_build=want_rt_build,
              expected_arch="arm64",
              expected_configuration="Screenshot",
              expected_bundle_id=ba.SCREENSHOT_BUNDLE_ID,
              expected_extension_id=ba.SCREENSHOT_EXTENSION_ID)
          if errs:
              for e in errs:
                  print(f"::error::build provenance mismatch: {e}")
              raise SystemExit(2)
          tar = tmp / "build" / "screenshot-app.tar.gz"
          if ba.hash_file(tar) != manifest["archive_sha256"]:
              print("::error::archive digest mismatch against the manifest")
              raise SystemExit(2)
          dest = tmp / "verified-app"
          extracted = ba.safe_extract(tar, dest)
          apps = [p for p in dest.iterdir()
                  if p.suffix == ".app" and p.is_dir()]
          if len(apps) != 1:
              print(f"::error::expected one .app, found {len(apps)}")
              raise SystemExit(2)
          struct_errs = ba.verify_app_structure(apps[0])
          if struct_errs:
              for e in struct_errs:
                  print(f"::error::{e}")
              raise SystemExit(2)
          res = manifest.get("resources") or {}
          hash_errs = ba.verify_hashes(
              apps[0], res.get("files", {}), res.get("symlinks"))
          if hash_errs:
              for e in hash_errs:
                  print(f"::error::{e}")
              raise SystemExit(2)
          mode_errs = ba.verify_extracted_modes(tar, dest)
          if mode_errs:
              for e in mode_errs:
                  print(f"::error::{e}")
              raise SystemExit(2)
          # Re-hash both Mach-Os against the manifest: the tar digest
          # above binds the archive, this binds the binaries it claims.
          def exe_of(bundle: Path) -> Path:
              with open(bundle / "Info.plist", "rb") as fh:
                  exe = plistlib.load(fh).get("CFBundleExecutable")
              if not exe or not isinstance(exe, str):
                  print(f"::error::no CFBundleExecutable in {bundle}")
                  raise SystemExit(2)
              return bundle / exe if (bundle / exe).is_file() \
                  else bundle / "Contents" / "MacOS" / exe
          if ba.hash_file(exe_of(apps[0])) != manifest["app_sha256"]:
              print("::error::app Mach-O hash mismatch against the manifest")
              raise SystemExit(2)
          # Same exact-identity binding as the build packaging above:
          # the worker re-hashes the manifest-claimed extension, never
          # whatever extra .appex a sorted glob would find first.
          appex = apps[0] / "PlugIns" / ba.SCREENSHOT_APPEX_NAME
          if not appex.is_dir():
              print(f"::error::expected appex "
                    f"{ba.SCREENSHOT_APPEX_NAME} missing in the verified app")
              raise SystemExit(2)
          if ba.hash_file(exe_of(appex)) != manifest["extension_sha256"]:
              print("::error::extension Mach-O hash mismatch "
                    "against the manifest")
              raise SystemExit(2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"app={apps[0]}\n")
          print(f"verified {apps[0].name}: {len(extracted)} members, "
                f"archive {manifest['archive_sha256'][:12]}")
          # Catalog sanity for this worker's key (geometry/island flow
          # through run_device_worker; unknown keys fail closed here).
          if os.environ["DEVICE_KEY"] not in wi.SUPPORTED_DEVICES:
              print(f"::error::unknown device "
                    f"{os.environ['DEVICE_KEY']!r}")
              raise SystemExit(2)
          PY

      - name: Resolve device catalog
        id: catalog
        env:
          # Matrix values come from validated workflow inputs: never
          # interpolate them into Python/shell source (injection). The
          # sim names come from the single workflow_inputs catalog, not
          # a replicated YAML list that could drift as it grows.
          DEVICE_KEY: ${{ matrix.device }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts/screenshots")
          import workflow_inputs as wi
          key = os.environ["DEVICE_KEY"]
          try:
              sim = wi.DEVICE_CATALOG[key]["sim"]
          except KeyError:
              print(f"::error::unknown device {key!r}; "
                    f"catalog: {sorted(wi.DEVICE_CATALOG)}")
              raise SystemExit(2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"sim={sim}\n")
          PY

      - name: Find and boot preinstalled simulator
        id: sim
        env:
          # Matrix values come from validated workflow inputs: never
          # interpolate them into Python/shell source (injection). The
          # sim name comes from the single workflow_inputs catalog step.
          DEVICE_KEY: ${{ matrix.device }}
          DEVICE_SIM: ${{ steps.catalog.outputs.sim }}
          IOS_RUNTIME: ${{ needs.validate.outputs.runtime }}
        run: |
          # Preinstalled-sim lookup (xcode-27-arm64 image pins iOS 27.0
          # with iPhone 17 / iPhone 18 Pro Max / iPad Pro 13-inch (M5)):
          # no per-run simulator creation — the exact device name under
          # the exact requested runtime selects ONE preinstalled
          # simulator. Zero matches or multiple matches fail closed
          # (exit 2, naming the expected set); never pick arbitrarily.
          # Same `udid` output contract as the retired create path
          # (no legacy branch).
          # PENDING (owner frame decision): 18 Pro Max captures are
          # review material until the owner approves the frame/bezel
          # pairing — this step invents no art and leaves
          # staging/verification untouched (panels-side bezel set is
          # panels-owner scope, not this step).
          RT="${IOS_RUNTIME// /-}"; RT="${RT//./-}"
          export WANT_RUNTIME="com.apple.CoreSimulator.SimRuntime.$RT"
          UDID=$(python3 - <<'PY'
          import json
          import os
          import subprocess
          want_name = os.environ["DEVICE_SIM"]
          want_runtime = os.environ["WANT_RUNTIME"]
          want_key = os.environ["DEVICE_KEY"]
          want_runtime_name = os.environ["IOS_RUNTIME"]
          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "-j"], text=True)
          try:
              buckets = json.loads(raw)["devices"]
          except (ValueError, KeyError, TypeError) as exc:
              print(f"::error::simctl list devices -j malformed: {exc}")
              raise SystemExit(2)
          hits = [entry["udid"]
                  for runtime_id, entries in buckets.items()
                  if runtime_id == want_runtime
                  for entry in entries
                  if entry.get("name") == want_name
                  and entry.get("udid")]
          if not hits:
              print(f"::error::no preinstalled simulator named "
                    f"{want_name!r} on runtime {want_runtime_name!r} "
                    f"for {want_key!r}; expected one of the pinned "
                    f"xcode-27 set (iPhone 17 / iPhone 18 Pro Max / "
                    f"iPad Pro 13-inch (M5))")
              raise SystemExit(2)
          if len(hits) != 1:
              print(f"::error::{len(hits)} preinstalled simulators named "
                    f"{want_name!r} on runtime {want_runtime_name!r}; "
                    f"refusing to pick arbitrarily")
              raise SystemExit(2)
          print(hits[0])
          PY
          )
          [ -n "$UDID" ] || { echo "::error::simulator lookup produced no UDID"; exit 2; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install verified app
        run: |
          xcrun simctl install "${{ steps.sim.outputs.udid }}" \
            "${{ steps.verify.outputs.app }}"

      - name: Write capture provenance
        # capture.py provenance shape ({commit_base, dirty}) is made
        # ONCE per worker run and forwarded to the device worker — it is
        # NOT the build manifest (different shapes for different gates).
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          base = subprocess.check_output(["git", "rev-parse", "HEAD"],
                                         text=True).strip()
          # Scoped like the build provenance: generated-project noise
          # under the xcodeproj must not mark every run dirty.
          dirty = bool(subprocess.check_output(
              ["git", "status", "--porcelain", "--", ".",
               ":(exclude)ios/TimeOfLife/TimeOfLife.xcodeproj"],
              text=True).strip())
          Path = __import__("pathlib").Path
          Path(os.environ["RUNNER_TEMP"]).joinpath(
              "capture-provenance.json").write_text(
                  json.dumps({"commit_base": base, "dirty": dirty}) + "\n")
          print(f"provenance: {base[:12]} dirty={dirty}")
          PY

      - name: Capture locales
        run: |
          # Sequential selected locales, one automated pass each,
          # pinned + realtime sessions inside one owned
          # simulator/install. Per-locale artifacts (single pass,
          # diagnostics, failed/unattempted statuses) land under
          # statuses) land under shots/<device>/<locale>; the device
          # summary lands at shots/<device>/worker-summary.json.
          mkdir -p "${RUNNER_TEMP}/shots"
          python3 scripts/screenshots/run_device_worker.py \
            --device-key "$DEVICE_KEY" \
            --device "${{ steps.sim.outputs.udid }}" \
            --locales "$LANGUAGES" \
            --out "${RUNNER_TEMP}/shots" \
            --provenance "${RUNNER_TEMP}/capture-provenance.json"

      - name: Backfill unreached pair statuses
        # Pre-capture failures (verify/create/boot/install/provenance)
        # never enter run_device_worker, so no status files exist for
        # them. Derive the exact selected locales from the safe
        # environment, preserve every finished record, and write
        # explicit unattempted statuses for pairs never reached — never
        # claim complete, never overwrite.
        if: always()
        env:
          DEVICE_KEY: ${{ matrix.device }}
          LANGUAGES: ${{ needs.validate.outputs.languages }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts/screenshots")
          import workflow_artifacts as wa
          import workflow_inputs as wi
          from pathlib import Path
          try:
              locales = wi.parse_locale_selection(os.environ["LANGUAGES"])
          except wi.InputError as exc:
              print(f"::error::invalid languages: {exc}")
              raise SystemExit(2)
          created = wa.backfill_unattempted(
              Path(os.environ["RUNNER_TEMP"]) / "shots",
              os.environ["DEVICE_KEY"], locales,
              "worker did not reach this pair (pre-capture failure, "
              "cancel, or crash); no success claimed")
          print(f"backfilled {len(created)} unattempted status(es)")
          PY

      - name: Stage pair uploads
        # Each per-locale upload is a SINGLE pair directory: copy the
        # device worker summary into the locale cell so downloaders get
        # runs/, requests/, statuses, and the summary at one root —
        # never a locale nested inside a locale.
        if: always()
        env:
          DEVICE_KEY: ${{ matrix.device }}
          LANGUAGES: ${{ needs.validate.outputs.languages }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts/screenshots")
          import workflow_artifacts as wa
          import workflow_inputs as wi
          from pathlib import Path
          try:
              locales = wi.parse_locale_selection(os.environ["LANGUAGES"])
          except wi.InputError as exc:
              print(f"::error::invalid languages: {exc}")
              raise SystemExit(2)
          root = Path(os.environ["RUNNER_TEMP"]) / "shots"
          for locale in locales:
              staged = wa.stage_pair_upload(
                  root, os.environ["DEVICE_KEY"], locale)
              print(f"staged {staged}")
          PY

      - name: Upload en captures
        if: always() && contains(needs.validate.outputs.languages, '"en"')
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.device }}-en
          path: ${{ runner.temp }}/shots/${{ matrix.device }}/en
          retention-days: 14

      - name: Upload ru captures
        if: always() && contains(needs.validate.outputs.languages, '"ru"')
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.device }}-ru
          path: ${{ runner.temp }}/shots/${{ matrix.device }}/ru
          retention-days: 14

      - name: Upload zh-Hans captures
        if: always() && contains(needs.validate.outputs.languages, '"zh-Hans"')
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.device }}-zh-Hans
          path: ${{ runner.temp }}/shots/${{ matrix.device }}/zh-Hans
          retention-days: 14

      - name: Upload es-419 captures
        if: always() && contains(needs.validate.outputs.languages, '"es-419"')
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.device }}-es-419
          path: ${{ runner.temp }}/shots/${{ matrix.device }}/es-419
          retention-days: 14

      - name: Upload pt-BR captures
        if: always() && contains(needs.validate.outputs.languages, '"pt-BR"')
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.device }}-pt-BR
          path: ${{ runner.temp }}/shots/${{ matrix.device }}/pt-BR
          retention-days: 14

      - name: Scoped simulator cleanup
        if: always()
        run: |
          # Preinstalled sims are shared runner state: NEVER delete one
          # (that would destroy the pinned set for later jobs). Release our
          # lease with a shutdown; uninstall only our Screenshot app bundle
          # (single-source bundle id, nothing else touched).
          UDID="${{ steps.sim.outputs.udid }}"
          [ -n "$UDID" ] || exit 0
          BID=$(python3 -c "import sys; sys.path.insert(0, 'scripts/screenshots'); import build_artifact as ba; print(ba.SCREENSHOT_BUNDLE_ID)")
          xcrun simctl uninstall "$UDID" "$BID" || true
          xcrun simctl shutdown "$UDID" || true

  panels:
    name: panels + zip
    needs: [validate, screenshots]
    # One red device worker must not discard the whole bundle:
    # fail-fast is false, every worker uploads its artifacts, and
    # panels.py records incomplete cells as blocked in the matrix
    # manifest. The Render step below tolerates that incomplete matrix
    # (warns, still zips+uploads) because CI la frames are
    # needs-inspection by design until the human handoff — only a
    # missing manifest fails the job.
    # Skipped upstream (validate/build failed, so screenshots never ran)
    # is NOT packaging work: without the screenshots result guard this
    # job would run on zero artifacts and fail opaquely in the download
    # steps instead of skipping cleanly. Red workers (result failure)
    # still package their partial bundle.
    if: "!cancelled() && needs.screenshots.result != 'skipped'"
    # Same xcode-27 macOS pool as build/capture (shared five-mac
    # ceiling; owner steering for shorter queues).
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: No binaries in git check
        # Before creating any artifact: inspects TRACKED content (a fresh
        # checkout's index always matches its worktree, so `git status`
        # alone can never see a binary committed in this PR) plus staged
        # additions, so untracked build outputs (the zip below) never trip
        # the guard. Scoped to pipeline outputs — Design/ artwork and the
        # AppIcon set are owner-approved and explicitly out of scope.
        run: |
          if git ls-files -z | tr '\0' '\n' | grep -Eq '\.zip$|(^|/)(shots|panels)/.*\.(png|jpg|jpeg)$'; then
            echo "::error::pipeline binaries tracked in git — see the no-binaries rule"; exit 2
          fi
          if git status --porcelain --untracked-files=no | grep -Eq '^ *[MADRC].*(\.zip$|(^|/)(shots|panels)/.*\.(png|jpg|jpeg)$)'; then
            echo "::error::pipeline binaries staged or modified in tracked files"; exit 2
          fi
          echo "tracked tree clean of pipeline binaries"

      - name: Download capture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: shots/dl

      - name: Download build manifest
        uses: actions/download-artifact@v4
        with:
          name: screenshot-build
          path: ${{ runner.temp }}/build

      - name: Flatten artifact layout
        # download-artifact extracts each artifact into shots/dl/<artifact-name>/,
        # but panels expects shots/<device>/<language>/runs/<run-id>/.
        # Re-sharding runs through the single workflow_artifacts helper
        # (unit-tested with fixtures): device keys come from longest
        # catalog prefix match so hyphenated locales (es-419, zh-Hans,
        # pt-BR) never misroute, and unknown names fail closed.
        run: |
          python3 - <<'PY'
          import shutil
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/screenshots")
          import workflow_artifacts as wa
          report = wa.reshard_downloaded_artifacts(
              Path("shots") / "dl", Path("shots"))
          print(f"resharded cells: {report['cells']}, "
                f"manifests: {report['manifests']}")
          shutil.rmtree(Path("shots") / "dl")
          PY

      - name: Fetch Apple bezel assets
        id: bezels
        env:
          # Step-scoped read-only token for the PRIVATE asset repo only
          # (fine-grained Contents-read on lifio-design-assets, §10.4).
          # `gh` reads it from the environment; it is never echoed,
          # never passed on a command line, never stored anywhere.
          GH_TOKEN: ${{ secrets.APPLE_BEZELS_TOKEN }}
        run: |
          # Private-release delivery (§10.4; live design-service fetch
          # retired): the 4 canonical Apple PNGs + release manifest
          # download from the private lifio-design-assets release
          # `apple-bezels-v2` into RUNNER_TEMP (never git, never the
          # public ZIP), then the local stage helper hash-verifies them
          # (manifest SHA first, then per-asset SHA/geometry/alpha —
          # local verification only: no design-service API, no
          # disk-image extraction) and stages canonical bezels for
          # panels --render-matrix.
          # The transcript must exist for EVERY failure mode: later
          # steps still run (see `if: "!cancelled()"` below) and the ZIP
          # carries bezel-fetch.log, so even a missing token records its
          # non-secret reason here — never only in this step's console.
          # Raw PNGs NEVER enter the public bundle: only this log is
          # copied into panels/; staged bezels stay in RUNNER_TEMP.
          mkdir -p "$RUNNER_TEMP/bezels" "$RUNNER_TEMP/bezels-src"
          if [ -z "$GH_TOKEN" ]; then
            echo "invalid: APPLE_BEZELS_TOKEN secret missing; bezel fetch refuses unauthenticated private-release access" | tee "$RUNNER_TEMP/bezels/bezel-fetch.log"
            echo "::error::APPLE_BEZELS_TOKEN secret missing"
            exit 2
          fi
          python3 -m pip install --break-system-packages "Pillow==13.0.0"
          set +e
          gh release download apple-bezels-v2 \
            --repo AntonKosenkoPro/lifio-design-assets \
            --pattern "iphone-17-pro-max-silver-portrait.png" \
            --pattern "iphone-17-white-portrait.png" \
            --pattern "ipad-pro-m5-13inch-silver-portrait.png" \
            --pattern "iphone-18-pro-max-silver-portrait.png" \
            --pattern "apple-bezels-manifest.json" \
            --dir "$RUNNER_TEMP/bezels-src" \
            --clobber >"$RUNNER_TEMP/bezels/bezel-fetch.log" 2>&1
          dl_rc=$?
          if [ "$dl_rc" -ne 0 ]; then
            echo "private-release download failed (exit $dl_rc)" >>"$RUNNER_TEMP/bezels/bezel-fetch.log"
          fi
          python3 scripts/panels/stage_bezel_assets.py \
            --source-dir "$RUNNER_TEMP/bezels-src" \
            --out "$RUNNER_TEMP/bezels" \
            --manifest "$RUNNER_TEMP/bezels-src/apple-bezels-manifest.json" \
            --expected-manifest-sha "c8d0ce9f2213872794a51960600755e668d9666f078cf7eb7b0ba6e5c28ae817" >>"$RUNNER_TEMP/bezels/bezel-fetch.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/bezels/bezel-fetch.log"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::bezel fetch failed (exit $rc) — continuing to render with whatever bezels verified; missing cells stay blocked, no art fabricated"
          fi
          exit "$rc"

      - name: Render panels
        # Runs even when the bezel fetch failed: successfully fetched bezels
        # still render their cells while drifted/missing ones block per-cell
        # in matrix-manifest.json (no fabricated panels). The job stays red
        # via the failed fetch step; this step only governs the bundle.
        if: "!cancelled()"
        env:
          DEVICES: ${{ needs.validate.outputs.devices }}
          LANGUAGES: ${{ needs.validate.outputs.languages }}
        run: |
          python3 -m pip install --break-system-packages "Pillow==13.0.0"
          rc=0
          # Captions live with the change: active dir first, dated archive
          # fallback (archived 2026-11-03 — the bare active path alone
          # fails closed on every post-archive run).
          CAPTIONS_DIR="openspec/changes/app-store-screenshot-pilot/captions"
          if [ ! -d "$CAPTIONS_DIR" ]; then
            CAPTIONS_DIR="openspec/changes/archive/2026-11-03-app-store-screenshot-pilot/captions"
          fi
          python3 scripts/panels/panels.py --render-matrix \
            --shots-dir shots --bezels-dir "$RUNNER_TEMP/bezels" \
            --out "$RUNNER_TEMP/panels" --devices "$DEVICES" \
            --languages "$LANGUAGES" \
            --captions-dir "$CAPTIONS_DIR" || rc=$?
          # An incomplete matrix (exit 2) still uploads: every CI la frame
          # is needs-inspection until the human record-external-frame
          # handoff, so verify_sources refuses them and the matrix is
          # incomplete BY DESIGN here — the manifest records each blocked
          # cell and stays downloadable. Fail only when no manifest was
          # written at all (a hard invocation error, not blocked cells).
          if [ "$rc" -ne 0 ] && [ ! -f "$RUNNER_TEMP/panels/matrix-manifest.json" ]; then exit "$rc"; fi
          if [ "$rc" -ne 0 ]; then echo "::warning::panels matrix incomplete (exit $rc) — blocked cells recorded in matrix-manifest.json; uploading partial bundle"; fi
          # Carry the bezel-fetch transcript into the bundle so the ZIP
          # preserves the exact drift/secret/network reason alongside the
          # per-cell blocked reasons (evidence, never a substitute bezel).
          # Best effort with loud warnings: a copy failure warns but never
          # fails this step (the matrix manifest is the primary evidence),
          # and a missing transcript or panels dir warns instead of passing
          # silently — the bundle stays partial, never falsely complete.
          if [ -f "$RUNNER_TEMP/bezels/bezel-fetch.log" ] && [ -d "$RUNNER_TEMP/panels" ]; then
            if cp "$RUNNER_TEMP/bezels/bezel-fetch.log" "$RUNNER_TEMP/panels/bezel-fetch.log"; then
              echo "bundled bezel-fetch.log"
            else
              echo "::warning::could not copy bezel-fetch.log into the panels bundle (rc $?) — transcript stays in the fetch step's console log only; bundle carries the matrix manifest"
            fi
          elif [ ! -f "$RUNNER_TEMP/bezels/bezel-fetch.log" ]; then
            echo "::warning::no bezel-fetch.log to bundle (fetch step never wrote one) — bundle carries the matrix manifest only"
          else
            echo "::warning::no panels dir to receive bezel-fetch.log — bundle carries no rendered panels"
          fi
          # Same best-effort loud handling for the stage transcript:
          # bezel-stage.json records the release tag, manifest SHA, and
          # per-asset hashes/geometry/provenance (evidence only — never
          # raw PNGs, which stay in RUNNER_TEMP and out of the ZIP).
          if [ -f "$RUNNER_TEMP/bezels/bezel-stage.json" ] && [ -d "$RUNNER_TEMP/panels" ]; then
            if cp "$RUNNER_TEMP/bezels/bezel-stage.json" "$RUNNER_TEMP/panels/bezel-stage.json"; then
              echo "bundled bezel-stage.json"
            else
              echo "::warning::could not copy bezel-stage.json into the panels bundle (rc $?) — transcript stays in the fetch step's console log only; bundle carries the matrix manifest"
            fi
          elif [ ! -f "$RUNNER_TEMP/bezels/bezel-stage.json" ]; then
            echo "::warning::no bezel-stage.json to bundle (stage step never wrote one) — bundle carries the matrix manifest only"
          else
            echo "::warning::no panels dir to receive bezel-stage.json — bundle carries no rendered panels"
          fi

      - name: Write README and zip
        # Runs even when the bezel fetch failed so a handoff/debug bundle
        # (partial panels + matrix manifest + fetch transcript + shots) is
        # still downloadable; blocked cells stay blocked, never fabricated.
        if: "!cancelled()"
        # The delivered ZIP is self-contained: rendered panels plus the
        # raw per-locale captures (single pass, frame records, receipts,
        # statuses) plus the verified build manifest. Blocked source
        # cells stay blocked per the existing matrix policy (no new
        # render behavior); the bundle README still reports handoff
        # versus complete, never approval.
        env:
          IOS_RUNTIME: ${{ needs.validate.outputs.runtime }}
          DEVICES: ${{ needs.validate.outputs.devices }}
          LANGUAGES: ${{ needs.validate.outputs.languages }}
        run: |
          python3 scripts/panels/write_bundle_readme.py \
            --panels-dir "$RUNNER_TEMP/panels" --shots-dir shots \
            --ios-runtime "$IOS_RUNTIME" \
            --devices "$DEVICES" \
            --languages "$LANGUAGES" \
            --out bundle-readme.md
          # Keep the repo README untouched: the bundle carries its own file.
          cp bundle-readme.md "$RUNNER_TEMP/panels/BUNDLE-README.md"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/lifio-screenshots-${{ github.sha }}.zip" panels build/build-manifest.json)
          (cd "$GITHUB_WORKSPACE" && zip -qr lifio-screenshots-${{ github.sha }}.zip shots)
          rm bundle-readme.md

      - name: Upload bundle
        # Uploads even when the bezel fetch failed: without this the run
        # ends with no final ZIP (proven 41813403434/41776556435) despite
        # downloadable partial panels existing. The job conclusion stays
        # failed via the fetch step — this never greens a red run.
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: lifio-screenshots-${{ github.sha }}
          path: lifio-screenshots-${{ github.sha }}.zip
          retention-days: 30
