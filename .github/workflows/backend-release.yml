name: backend-release

# Pinned backend image builds: the owner pushes a signed backend/* tag
# (grammar + runbook: docs/ci.md) and this workflow builds + pushes both the
# immutable pinned image and the floating :latest. No lint/test here — tags
# are created only on main, whose pushes already ran the backend checks. No
# SSH deploy here either — deploys stay on main pushes (backend.yml) until
# the Phase 3 environments land.
#
# NOTE: this trigger intentionally has NO `paths:` filter. A tag-only push
# carries no new commits, so a paths filter would match nothing and the
# workflow would silently never run. Keep it that way.
on:
  push:
    tags:
      - "backend/*"

permissions:
  contents: read
  packages: write  # needed to push to GHCR

# Manual tags are sequential by construction; serialize just in case two
# land close together so :latest never ends up older than a pinned tag.
concurrency:
  group: backend-release
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags and version
        id: image
        run: |
          REPO="${{ github.repository }}"
          REPO_LC="${REPO,,}"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          # backend/v2.5.0 -> backend-v2.5.0 (pinned, immutable) + :latest (floating).
          TAG_SUFFIX="$(echo "${{ github.ref_name }}" | tr '/' '-')"
          echo "sha=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/${REPO_LC}/backend:${TAG_SUFFIX},ghcr.io/${REPO_LC}/backend:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            SHA=${{ steps.image.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
