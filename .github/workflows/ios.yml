name: ios

# Requirements S6: linters + tests run on every pull request as a mandatory check.
# GH-owned iOS PR gate (see docs/ci.md): pull_request + push triggers below.
# dSYMs for shipped builds come from Xcode Cloud's signed tag archives
# (ci_post_xcodebuild.sh) — there is intentionally no GH-side archive job.
on:
  pull_request:
    # No path filter: the ios-gate job must run and report on EVERY PR —
    # path-skipped workflows leave required checks Pending forever and block
    # the PR (observed: #211). Path selection happens in the changes job.
  push:
    branches: [main]
    paths:
      - "ios/**"

permissions:
  contents: read

# Rapid PR pushes cancel superseded runs instead of queueing redundant
# macos-15 jobs. The group is keyed on event as well as ref so a push to
# main and a PR run never cancel each other mid-flight.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # In-workflow path detection (the required ios-gate must always run, so the
  # workflow itself cannot be path-filtered). Same-repo opsx/* branches
  # assumed; any detection failure resolves to true (lane runs — minutes,
  # never a silent skip).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Same-repo branches assumed (opsx/* flow). Any detection failure
          # resolves to true (lane runs — minutes, never a silent skip).
          # NOTE: no pipefail-negation here — a failing git diff must not
          # read as "no match" (fail-open). Local object checked first so
          # the defensive fetch (fetch-depth: 0 usually has the base)
          # only runs when genuinely missing; core.quotePath=false keeps
          # non-ASCII paths matchable.
          if [ "$EVENT" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"  # push path-filters already matched
          elif { git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch origin "$BASE" 2>/dev/null; } \
            && files="$(git -c core.quotePath=false diff --name-only "$BASE...HEAD")" \
            && ! printf '%s\n' "$files" | grep -Eq '^(ios/|\.github/workflows/ios\.yml)'; then
            echo "ios=false" >> "$GITHUB_OUTPUT"
          else
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  lint-build-test:
    needs: [changes]
    # Push (path-filtered) and release-verify always run the lane; PRs only
    # when the diff touches it. Skipped (not failed) otherwise — ios-gate
    # still reports.
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen + swiftlint
        run: brew install xcodegen swiftlint

      - name: Generate Xcode project
        working-directory: ios/TimeOfLife
        run: xcodegen generate

      - name: SwiftLint
        working-directory: ios/TimeOfLife
        run: swiftlint lint --strict

      - name: Build with warnings as errors
        # SWIFT_TREAT_WARNINGS_AS_ERRORS/GCC_TREAT_WARNINGS_AS_ERRORS are set
        # per-target in project.yml — the CLI variants conflict with the
        # -suppress-warnings flag Xcode adds to SPM package targets (GRDB).
        working-directory: ios/TimeOfLife
        run: |
          set -o pipefail
          xcodebuild -scheme TimeOfLife \
            -destination 'generic/platform=iOS Simulator' \
            build | xcpretty

      - name: Resolve simulator destination
        id: sim
        working-directory: ios/TimeOfLife
        run: |
          NAME=$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys
          ds=json.load(sys.stdin)["devices"]
          print(next(d["name"] for rt in ds for d in ds[rt]
                     if "iPhone" in d["name"] and d.get("isAvailable")))')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: ios/TimeOfLife
        run: |
          set -o pipefail
          xcodebuild -scheme TimeOfLife \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            test | xcpretty

  # Required check (ruleset): always reports, even when the lane is skipped
  # on non-ios PRs. Passes only if detection succeeded AND the lane is
  # success-or-skip; a changes failure fails the gate (never green-unverified).
  ios-gate:
    if: always()
    needs: [changes, lint-build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes ${{ needs.changes.result }}"; exit 1
          fi
          case "${{ needs.lint-build-test.result }}" in
            success|skipped) echo "lint-build-test ${{ needs.lint-build-test.result }} — gate green";;
            *) echo "::error::lint-build-test ${{ needs.lint-build-test.result }}"; exit 1;;
          esac
