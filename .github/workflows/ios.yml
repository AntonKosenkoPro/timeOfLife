name: ios

# Requirements S6: linters + tests run on every pull request as a mandatory check.
on:
  # Also callable as release verification: GITHUB_TOKEN pushes trigger no
  # workflows, so the release workflow invokes this explicitly on the bump.
  workflow_call:
    # Release-path flag: release.yml verify passes upload_dsyms=true so the
    # post-bump head gets its dSYMs. PR/push runs keep the default false —
    # one macos-15 job per PR. (A plain event_name check cannot do this:
    # inside a called workflow the github context belongs to the caller,
    # so event_name reports the caller's trigger, never workflow_call.)
    inputs:
      upload_dsyms:
        description: "Run the sentry-dsym job (unsigned Release archive + Sentry upload)"
        required: false
        default: false
        type: boolean
    # Sentry symbolication wiring (observability Stage 0, task 3.3). All
    # optional: when any are absent the upload step skips with a warning
    # instead of failing. release.yml passes them via `secrets: inherit`.
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT_STAGING:
        required: false
      SENTRY_PROJECT_RELEASE:
        required: false
      # iOS DSN threaded into the archive build as SENTRY_DSN (empty =
      # SDK disabled). Absent = the archived binary simply has no DSN;
      # dSYM upload still proceeds if its own secrets exist.
      SENTRY_IOS_DSN:
        required: false
  pull_request:
    # No path filter: the ios-gate job must run and report on EVERY PR —
    # path-skipped workflows leave required checks Pending forever and block
    # the PR (observed: #211). Path selection happens in the changes job.
  push:
    branches: [main]
    paths:
      - "ios/**"

permissions:
  contents: read

# Rapid PR pushes cancel superseded runs instead of queueing redundant
# macos-15 jobs. The group is keyed on event as well as ref: a push to main
# and the release-verify call (both ref main, different events) must never
# cancel each other mid-flight.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # In-workflow path detection (the required ios-gate must always run, so the
  # workflow itself cannot be path-filtered). Same-repo opsx/* branches
  # assumed; any detection failure resolves to true (lane runs — minutes,
  # never a silent skip).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Same-repo branches assumed (opsx/* flow). Any detection failure
          # resolves to true (lane runs — minutes, never a silent skip).
          # NOTE: no pipefail-negation here — a failing git diff must not
          # read as "no match" (fail-open). Local object checked first so
          # the defensive fetch (fetch-depth: 0 usually has the base)
          # only runs when genuinely missing; core.quotePath=false keeps
          # non-ASCII paths matchable.
          if [ "$EVENT" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"  # push path-filters already matched
          elif { git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch origin "$BASE" 2>/dev/null; } \
            && files="$(git -c core.quotePath=false diff --name-only "$BASE...HEAD")" \
            && ! printf '%s\n' "$files" | grep -Eq '^(ios/|\.github/workflows/ios\.yml)'; then
            echo "ios=false" >> "$GITHUB_OUTPUT"
          else
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  lint-build-test:
    needs: [changes]
    # Push (path-filtered) and release-verify always run the lane; PRs only
    # when the diff touches it. Skipped (not failed) otherwise — ios-gate
    # still reports.
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen + swiftlint
        run: brew install xcodegen swiftlint

      - name: Generate Xcode project
        working-directory: ios/TimeOfLife
        run: xcodegen generate

      - name: SwiftLint
        working-directory: ios/TimeOfLife
        run: swiftlint lint --strict

      - name: Build with warnings as errors
        # SWIFT_TREAT_WARNINGS_AS_ERRORS/GCC_TREAT_WARNINGS_AS_ERRORS are set
        # per-target in project.yml — the CLI variants conflict with the
        # -suppress-warnings flag Xcode adds to SPM package targets (GRDB).
        working-directory: ios/TimeOfLife
        run: |
          set -o pipefail
          xcodebuild -scheme TimeOfLife \
            -destination 'generic/platform=iOS Simulator' \
            build | xcpretty

      - name: Resolve simulator destination
        id: sim
        working-directory: ios/TimeOfLife
        run: |
          NAME=$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys
          ds=json.load(sys.stdin)["devices"]
          print(next(d["name"] for rt in ds for d in ds[rt]
                     if "iPhone" in d["name"] and d.get("isAvailable")))')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: ios/TimeOfLife
        run: |
          set -o pipefail
          xcodebuild -scheme TimeOfLife \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            test | xcpretty

  # Required check (ruleset): always reports, even when the lane is skipped
  # on non-ios PRs. Passes only if detection succeeded AND the lane is
  # success-or-skip; a changes failure fails the gate (never green-unverified).
  ios-gate:
    if: always()
    needs: [changes, lint-build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes ${{ needs.changes.result }}"; exit 1
          fi
          case "${{ needs.lint-build-test.result }}" in
            success|skipped) echo "lint-build-test ${{ needs.lint-build-test.result }} — gate green";;
            *) echo "::error::lint-build-test ${{ needs.lint-build-test.result }}"; exit 1;;
          esac

  # Symbolication for shipped crashes (observability Stage 0, task 3.3):
  # archives Release unsigned (no signing identity on CI runners) purely to
  # produce dSYMs, then uploads them with sentry-cli. dSYMs match by debug
  # ID, so one archive covers both environments — the upload loops over the
  # staging and release projects, skipping each whose secrets are absent.
  # Runs only after lint-build-test is green (no symbols for unverified code).
  # Release-path only (see the upload_dsyms input above): PR/push runs
  # skip it — one macos-15 job per PR — while release.yml verify still gets
  # its dSYMs. Runs only after lint-build-test is green (the default
  # success() gate still applies: a bare expression if adds no status
  # check, so needs stays success-gated) — no symbols for unverified code.
  sentry-dsym:
    if: ${{ inputs.upload_dsyms }}
    needs: lint-build-test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen + sentry-cli
        run: brew install xcodegen getsentry/tools/sentry-cli

      - name: Generate Xcode project
        working-directory: ios/TimeOfLife
        run: xcodegen generate

      - name: Archive Release (unsigned) for dSYMs
        working-directory: ios/TimeOfLife
        env:
          SENTRY_IOS_DSN: ${{ secrets.SENTRY_IOS_DSN }}
        run: |
          set -o pipefail
          xcodebuild archive -scheme TimeOfLife \
            -destination 'generic/platform=iOS' \
            -archivePath build/TimeOfLife.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            SENTRY_DSN="$SENTRY_IOS_DSN" | xcpretty

      - name: Upload dSYMs to Sentry (staging + release)
        working-directory: ios/TimeOfLife
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_STAGING: ${{ secrets.SENTRY_PROJECT_STAGING }}
          SENTRY_PROJECT_RELEASE: ${{ secrets.SENTRY_PROJECT_RELEASE }}
        run: |
          upload_project() {
            name="$1"; project="$2"; secret_name="$3"
            if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$project" ]; then
              echo "::warning::Sentry secrets absent — skipping dSYM upload ($name). Needs SENTRY_AUTH_TOKEN, SENTRY_ORG, $secret_name."
              return 0
            fi
            sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$project" \
              build/TimeOfLife.xcarchive/dSYMs
          }
          upload_project staging "$SENTRY_PROJECT_STAGING" SENTRY_PROJECT_STAGING
          upload_project release "$SENTRY_PROJECT_RELEASE" SENTRY_PROJECT_RELEASE
