name: ios

# Requirements S6: linters + tests run on every pull request as a mandatory check.
# GH-owned iOS PR gate (see docs/ci.md): pull_request + push triggers below.
# dSYMs for shipped builds come from Xcode Cloud's signed tag archives
# (ci_post_xcodebuild.sh) — there is intentionally no GH-side archive job.
on:
  pull_request:
    # No path filter: the ios-gate job must run and report on EVERY PR —
    # path-skipped workflows leave required checks Pending forever and block
    # the PR (observed: #211). Path selection happens in the changes job.
  push:
    branches: [main]
    paths:
      - "ios/**"

permissions:
  contents: read

# Rapid PR pushes cancel superseded runs instead of queueing redundant
# macos-15 jobs. The group is keyed on event as well as ref so a push to
# main and a PR run never cancel each other mid-flight.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # In-workflow path detection (the required ios-gate must always run, so the
  # workflow itself cannot be path-filtered). Same-repo opsx/* branches
  # assumed; any detection failure resolves to true (lane runs — minutes,
  # never a silent skip).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Same-repo branches assumed (opsx/* flow). Any detection failure
          # resolves to true (lane runs — minutes, never a silent skip).
          # NOTE: no pipefail-negation here — a failing git diff must not
          # read as "no match" (fail-open). Local object checked first so
          # the defensive fetch (fetch-depth: 0 usually has the base)
          # only runs when genuinely missing; core.quotePath=false keeps
          # non-ASCII paths matchable.
          if [ "$EVENT" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"  # push path-filters already matched
          elif { git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch origin "$BASE" 2>/dev/null; } \
            && files="$(git -c core.quotePath=false diff --name-only "$BASE...HEAD")" \
            && ! printf '%s\n' "$files" | grep -Eq '^(ios/|\.github/workflows/ios\.yml)'; then
            echo "ios=false" >> "$GITHUB_OUTPUT"
          else
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  lint-build-test:
    needs: [changes]
    # Push (path-filtered) and release-verify always run the lane; PRs only
    # when the diff touches it. Skipped (not failed) otherwise — ios-gate
    # still reports.
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Full history + tags: the stamp harness asserts history-aware banding
      # (ancestor re-upload case needs HEAD~1) and enumerates tags per
      # marketing line — a shallow checkout would SKIP the former and run
      # the latter empty, both silently.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned xcodegen + swiftlint
        # Both tools are fail-closed pinned in the Cloud scripts; an unpinned
        # brew install would let the PR gate drift from the release gate the
        # day Homebrew moves on. Pins are read from the scripts themselves
        # (single source of truth) and validated before use so a reformatted
        # pin line fails loudly instead of installing from a `//` URL
        # (grep -m1 + cut: no `| head` pipe, so no SIGPIPE hazard under
        # `set -e` — same reason BIN below uses find -print -quit).
        run: |
          XCODEGEN_PIN="$(grep -m1 '^XCODEGEN_PIN="' ios/TimeOfLife/ci_scripts/ci_post_clone.sh | cut -d'"' -f2)"
          [ -n "$XCODEGEN_PIN" ] || { echo "::error::cannot read XCODEGEN_PIN from ci_post_clone.sh — refusing to install an unpinned xcodegen"; exit 1; }
          SWIFTLINT_PIN="$(grep -m1 '^SWIFTLINT_PIN="' ios/TimeOfLife/ci_scripts/ci_pre_xcodebuild.sh | cut -d'"' -f2)"
          [ -n "$SWIFTLINT_PIN" ] || { echo "::error::cannot read SWIFTLINT_PIN from ci_pre_xcodebuild.sh — refusing to install an unpinned swiftlint"; exit 1; }
          # Recorded digests: upstream release assets can be replaced in
          # place, and the SwiftLint pkg is unsigned (verified: `pkgutil
          # --check-signature` reports "no signature"), so the digest is the
          # only integrity control — a replaced artifact fails here instead
          # of being sudo-installed. Bump with the pin.
          XCODEGEN_ZIP_SHA256="4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
          SWIFTLINT_PKG_SHA256="3fb0202842701762880cc2cf04fc394398bab3f16a04dd76e000e02d07e32486"
          # -f fails on HTTP errors (no error pages written to disk);
          # --retry rides out transient CDN 5xx instead of red-laning the PR.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_PIN}/xcodegen.zip" -o "${RUNNER_TEMP}/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  ${RUNNER_TEMP}/xcodegen.zip" | shasum -a 256 -c -
          rm -rf "${RUNNER_TEMP}/xcodegen" && mkdir -p "${RUNNER_TEMP}/xcodegen"
          unzip -o -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}/xcodegen"
          # The zip is a prefix tree (bin/xcodegen + share/xcodegen presets),
          # not a flat binary — and the wrapper layout is not contractual, so
          # locate it. The presets must travel with the binary: XcodeGen
          # resolves SettingPresets relative to its prefix, and a lone
          # binary fails generate on a clean runner. Assert the exact
          # share/xcodegen subdir BEFORE installing so a bad archive leaves
          # no half-installed state.
          BIN="$(find "${RUNNER_TEMP}/xcodegen" -path '*/bin/xcodegen' -type f -print -quit)"
          [ -n "$BIN" ] || { echo "::error::xcodegen binary not found in release archive"; exit 1; }
          XG_ROOT="$(dirname "$(dirname "$BIN")")"
          [ -d "$XG_ROOT/share/xcodegen" ] || { echo "::error::xcodegen share/xcodegen presets missing from release archive"; exit 1; }
          sudo install -m 755 "$BIN" /usr/local/bin/xcodegen
          sudo mkdir -p /usr/local/share && sudo cp -R "$XG_ROOT/share/xcodegen" /usr/local/share/
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_PIN}/SwiftLint.pkg" -o "${RUNNER_TEMP}/swiftlint.pkg"
          echo "${SWIFTLINT_PKG_SHA256}  ${RUNNER_TEMP}/swiftlint.pkg" | shasum -a 256 -c -
          sudo installer -pkg "${RUNNER_TEMP}/swiftlint.pkg" -target /
          # Prove the pins against the installed paths (not PATH: the
          # macos-15 image ships its own swiftlint earlier in PATH, which
          # would false-fail — or worse, false-pass — a PATH-resolved
          # check), then put the pinned prefix first for later steps.
          test "$(/usr/local/bin/xcodegen --version | grep -m1 -o '[0-9][0-9.]*')" = "$XCODEGEN_PIN" || \
            { echo "::error::xcodegen drift: got $(/usr/local/bin/xcodegen --version), want $XCODEGEN_PIN"; exit 1; }
          test "$(/usr/local/bin/swiftlint version)" = "$SWIFTLINT_PIN" || \
            { echo "::error::swiftlint drift: got $(/usr/local/bin/swiftlint version), want $SWIFTLINT_PIN"; exit 1; }
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        working-directory: ios/TimeOfLife
        run: xcodegen generate

      - name: SwiftLint
        working-directory: ios/TimeOfLife
        run: swiftlint lint --strict

      - name: Release stamp harness
        # Regression gate for ci_post_clone.sh (banding math, sequence
        # parsing, tag/pair disambiguation): a wrong build number surfaces
        # only at App Store Connect, so this runs before the long build.
        # Self-restoring (project files + tags + origin URL); leaves a clean
        # tree for the steps below.
        working-directory: ios/TimeOfLife
        run: sh ci_scripts/tests/stamp_test.sh

      - name: Build with warnings as errors
        # SWIFT_TREAT_WARNINGS_AS_ERRORS/GCC_TREAT_WARNINGS_AS_ERRORS are set
        # per-target in project.yml — the CLI variants conflict with the
        # -suppress-warnings flag Xcode adds to SPM package targets (GRDB).
        working-directory: ios/TimeOfLife
        run: |
          set -o pipefail
          xcodebuild -scheme TimeOfLife \
            -destination 'generic/platform=iOS Simulator' \
            build | xcpretty

      - name: Resolve simulator destination
        id: sim
        working-directory: ios/TimeOfLife
        run: |
          NAME=$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys
          ds=json.load(sys.stdin)["devices"]
          print(next(d["name"] for rt in ds for d in ds[rt]
                     if "iPhone" in d["name"] and d.get("isAvailable")))')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: ios/TimeOfLife
        run: |
          set -o pipefail
          xcodebuild -scheme TimeOfLife \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            test | xcpretty

  # Required check (ruleset): always reports, even when the lane is skipped
  # on non-ios PRs. Passes only if detection succeeded AND the lane is
  # success-or-skip; a changes failure fails the gate (never green-unverified).
  ios-gate:
    if: always()
    needs: [changes, lint-build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes ${{ needs.changes.result }}"; exit 1
          fi
          case "${{ needs.lint-build-test.result }}" in
            success|skipped) echo "lint-build-test ${{ needs.lint-build-test.result }} — gate green";;
            *) echo "::error::lint-build-test ${{ needs.lint-build-test.result }}"; exit 1;;
          esac
