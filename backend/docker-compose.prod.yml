# Production docker-compose file for Lifio backend.
# Used by the CI/CD pipeline to deploy to the GCP VM.
# Environment variables are loaded from .env (or set in the CI/CD environment).

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: timeoflife
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/antonkosenkopro/timeoflife/backend:${BACKEND_IMAGE_TAG:-latest}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:      # Hosted-DB split (migrate-db-to-supabase-free): a set DATABASE_URL
      # repoints the backend at hosted Postgres (Supabase); empty keeps the
      # VM-local Postgres composed from DB_PASSWORD. Local postgres keeps
      # running either way so rollback is instant (retention: see change).
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${DB_PASSWORD}@postgres:5432/timeoflife?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      # Refresh recovery keyring (fix-refresh-response-loss). Required:
      # config.Load fail-fasts without it, so the secret must exist before
      # the new binary deploys. Rotate by prepending the new key and
      # removing the retired one on a later deploy.
      REFRESH_RECOVERY_KEYS: ${REFRESH_RECOVERY_KEYS:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      PORT: "8080"
      OTP_EXPIRY: ${OTP_EXPIRY:-10m}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_EMAIL_TEMPLATE: ${OTP_EMAIL_TEMPLATE:-}
      OTP_EMAIL_HTML_TEMPLATE: ${OTP_EMAIL_HTML_TEMPLATE:-}
      # Account-status evidence secret (explicit account deletion). REQUIRED:
      # at least 32 random bytes, MUST differ from JWT_SECRET.
      ACCOUNT_STATUS_SECRET: ${ACCOUNT_STATUS_SECRET:-}
      # AWS SES (real mail sender). Required when EMAIL_BACKEND=ses.
      # Set EMAIL_BACKEND=ses only after SES is verified in production.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      SES_FROM: ${SES_FROM:-}
      # Sign in with Apple + automatic unlinking on explicit deletion.
      # ALL-OR-NOTHING: when any of the five is set, all five are required
      # (startup fails fast on a partial set). APPLE_CLIENT_ID is the app's
      # Bundle ID; empty (all empty) disables the feature. APPLE_REDIRECT_URI
      # is the only optional one. APPLE_PRIVATE_KEY is the raw .p8 contents.
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI:-}
      APPLE_TOKEN_KEYS: ${APPLE_TOKEN_KEYS:-}
      APPLE_JWKS_URL: ${APPLE_JWKS_URL:-}
      # Sentry error reporting (observability Stage 0). Empty = disabled,
      # the server runs exactly as without Sentry.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # OTel pipeline (observability Stage 1). OTEL_ENABLED=0 (default) =
      # Stage-0 posture: the SDK stays off and the backend emits nothing.
      # The endpoint is the VM-local Collector (same compose network); local
      # dev outside compose uses localhost:4317 instead.
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      # Comma-separated IPs/CIDRs of reverse proxies allowed to set forwarded
      # IP headers for rate limiting. Empty = trust nobody.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    expose:
      - "8080"

  # OTel Collector (Stage 1, VM forwarding only): receives OTLP from the
  # backend (and later iOS spans) and forwards to Grafana Cloud. Buffers
  # seconds, stores nothing. Same log rotation as the other services. Stopping
  # this service (or OTEL_ENABLED=0) restores the exact Stage-0 posture.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      # SaaS seam (D1): endpoint + key arrive via the VM .env / CI secrets,
      # never the repo. Empty (default) = exporters idle against the discard
      # sentinel in otelcol-config.yaml; the service stays healthy, zero series.
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      GRAFANA_CLOUD_OTLP_KEY: ${GRAFANA_CLOUD_OTLP_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    expose:
      - "4317"
      - "4318"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  nginx:
    image: nginx:alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  default:
    name: timeoflife-net
    external: true
