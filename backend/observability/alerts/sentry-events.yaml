# Tripwire: Sentry events/month quota burn
# schema: lifio.alert/v1 (schema_version: 1) — repo-kept intent; SaaS rules converge FROM this file.
# Apply is MANUAL: plan-only CI (terraform-provider-grafana later); never console-edited.
schema_version: 1
alert:
  name: sentry-events-70pct
  signal: sentry_monthly_events
  tier: sentry
  # 70% of the Sentry monthly-events quota consumed in the current billing period.
  # Absolute event count is plan-dependent — resolve at apply time from the
  # Sentry quota API; this file pins the FRACTION, not the number.
  threshold:
    fraction_of_quota: 0.7
  evaluation:
    window: 24h        # quota-burn alert: re-evaluate daily
    for: 1h            # must hold for 1h before firing (avoids one-spike pages)
  route: telegram      # INTERRUPT lane per Stage-0 routing (solo-dev, sound on)
  shed_load_at_90pct:
    fraction_of_quota: 0.9
    action: >
      errors-only SDK — drop breadcrumbs and performance transactions,
      keep error capture (Stage-0 tripwire table:
      "errors-only, drop breadcrumbs/perf")
  dashboard: lifio-quotas
  notes: >
    Sentry stays the errors/crashes pillar (DSN flip only). This alert watches
    quota burn, not error content. Panel/query fields are intent only — the
    applied Grafana/Sentry rule is generated from this file via Terraform
    (manual apply), never hand-built in the console.
