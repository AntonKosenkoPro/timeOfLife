# SLI recording rules (draft) — schema: lifio.sli/v1 (schema_version: 1).
#
# *** SLO THRESHOLDS UNSET — DO NOT ALERT ON THESE ***
# Recording rules only (no alert rules). SLO numbers land after >= 2 weeks of
# stable traffic sets a baseline; the SLO-gate task stays OPEN until then.
# The weekly digest reads the LIVE rule(s) below; the weekly-group rules are
# placeholders until their signals exist (probe gauge, spanmetrics) — the
# digest reads raw series for those SLIs in the meantime. Vendor-neutral
# shape. LOAD-TIME CHECK: confirm the OTLP→Prometheus name mapping
# (dots→underscores + `_total` on counters) against Explore before loading;
# adjust, never add identifier labels.
#
# Label discipline: group/filter by allowlisted attributes ONLY —
# service.name, service.version, environment, http.method, http.route
# (templated, never raw UUIDs), http.status_class, operation.
schema_version: 1
groups:
  - name: lifio-sli
    interval: 1m
    rules:
      # 5xx share per operation (otp_verify, token_refresh, ...). Uses the
      # templated http.route + operation labels — never raw paths or user
      # identifiers. Canonical names: instrument `http.server.requests`
      # (otel.go) → `http_server_requests_total`; service `lifio-backend`.
      - record: lifio:http_5xx_rate_by_operation
        expr: >
          sum by (operation) (
            rate(http_server_requests_total{
              service_name="lifio-backend",
              http_status_class="5xx"
            }[5m])
          )
          /
          sum by (operation) (
            rate(http_server_requests_total{
              service_name="lifio-backend"
            }[5m])
          )

