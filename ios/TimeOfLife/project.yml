name: TimeOfLife
options:
  bundleIdPrefix: com.antonkosenko
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Code signing is disabled so simulator/CI builds need no Apple Developer
    # account. To ship via TestFlight/App Store later, set DEVELOPMENT_TEAM to
    # your Apple Team ID, flip CODE_SIGNING_REQUIRED/CODE_SIGN_IDENTITY to
    # "YES"/"Apple Distribution", and supply a provisioning profile.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
configs:
  Debug: debug
  Release: release
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.8.0
    minorVersion: 7
configFiles:
  Debug: TimeOfLife/Configuration/Config.Debug.xcconfig
  Release: TimeOfLife/Configuration/Config.Release.xcconfig
targets:
  TimeOfLife:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: TimeOfLife
        excludes:
          - "Configuration/Config.Debug.xcconfig"
          - "Configuration/Config.Release.xcconfig"
          - "Configuration/Info.plist"
          - "Configuration/TimeOfLife.entitlements"
      - path: TimeOfLife/Configuration/Config.Debug.xcconfig
        type: file
        buildPhase: none
      - path: TimeOfLife/Configuration/Config.Release.xcconfig
        type: file
        buildPhase: none
      - path: TimeOfLife/Configuration/TimeOfLife.entitlements
        type: file
        buildPhase: none
      - path: TimeOfLife/Localization/en.lproj
      - path: TimeOfLife/Localization/ru.lproj
    resources:
      - TimeOfLife/Resources/Assets.xcassets
    info:
      path: TimeOfLife/Configuration/Info.plist
      properties:
        CFBundleDisplayName: Time of Life
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: BackgroundPrimary
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        NSAppTransportSecurity:
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        UIUserInterfaceStyle: Automatic
        API_BASE_URL: "$(API_BASE_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonkosenko.timeoflife
        INFOPLIST_FILE: TimeOfLife/Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimeOfLife/Configuration/TimeOfLife.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentPrimary
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Warnings-as-errors for app/test targets only (not package deps like
        # GRDB, which builds with -suppress-warnings and conflicts otherwise).
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: GRDB
  TimeOfLifeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TimeOfLifeTests
    dependencies:
      - target: TimeOfLife
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonkosenko.timeoflife.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
  TimeOfLifeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TimeOfLifeUITests
    dependencies:
      - target: TimeOfLife
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonkosenko.timeoflife.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        TEST_TARGET_NAME: TimeOfLife
schemes:
  TimeOfLife:
    build:
      targets:
        TimeOfLife: all
        TimeOfLifeTests: [test]
        TimeOfLifeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimeOfLifeTests
        - TimeOfLifeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
