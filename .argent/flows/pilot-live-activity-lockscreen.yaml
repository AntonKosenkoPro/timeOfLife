executionPrerequisite: "Capture-only iPhone simulator with the screenshots build installed; a live-activity-realtime frame prepared to ready with a running Live Activity; device starts unlocked. Requires a simulator/hardware-press path that exposes the power button (unsupported on physical iPhone: only home/volumeUp/volumeDown/actionButton)."
steps:
  - echo: "Lock the device to reach the genuine Lock Screen and expect the running-activity card. The Lock Screen serves no runner tree (SpringBoard is not injectable), so this flow is deliberately procedural. The full-res screenshot is the human evidence. Live Activity presence, timer, and prompt handling are proven live per run in the run records and capture QA evidence."
  - tool: button
    args:
      button: power
  - wait: 1500
  - tool: button
    args:
      button: power
  - wait: 2000
  - tool: screenshot
    args:
      scale: 1
      includeImageInContext: false
